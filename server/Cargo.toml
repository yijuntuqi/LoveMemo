[package]
name = "lovememo-server"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Shuttle 平台部署时自动启用此 feature（见 Shuttle.toml 文档）
shuttle = ["shuttle-axum", "shuttle-runtime"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid"] }
jsonwebtoken = "9"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder"] }
shuttle-axum = { version = "0.57", optional = true, default-features = false, features = ["axum-0-7"] }
shuttle-runtime = { version = "0.57", optional = true }

[profile.dev]
# 调试模式下禁用增量编译的 hard-link 优化，避免某些文件系统报错 1117
incremental = false

[profile.release]
# 继续禁用增量编译以稳定 release 构建
incremental = false
opt-level = 2
lto = false
codegen-units = 16
strip = true
panic = "abort"
